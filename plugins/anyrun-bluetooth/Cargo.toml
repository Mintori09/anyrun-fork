[package]
name = "anyrun-bluetooth-kde"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyrun-plugin = { path = "../../anyrun-plugin" }
anyrun-helper = { workspace = true }
abi_stable    = "0.11.1"
ron           = "0.12.0"
serde         = { features = [ "derive" ], version = "1.0.228" }
urlencoding   = "2.1.3"
fuzzy-matcher = "*"
bluer = { version = "0.16", features = ["bluetoothd"] }
tokio = { version = "1", features = ["full"] }
