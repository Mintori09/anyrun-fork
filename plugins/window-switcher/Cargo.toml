[package]
name    = "window-switcher"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = [ "cdylib" ]

[dependencies]
abi_stable                = "0.11.1"
anyrun-plugin             = { path = "../../anyrun-plugin" }
anyrun-helper             = { workspace = true }
freedesktop-desktop-entry = "0.7.19"
niri-ipc                  = "25.5.1"
ron                       = "0.12.0"
serde                     = { features = [ "derive" ], version = "1.0" }
serde_json                = "1.0"
zbus                      = { version = "4.4.0", features = [ "blocking" ] }
