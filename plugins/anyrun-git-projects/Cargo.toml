[package]
name    = "anyrun-git-projects"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyrun-plugin = { path = "../../anyrun-plugin" }
anyrun-helper = { workspace = true }
abi_stable    = "0.11.1"
ron           = "0.12.0"
serde         = { features = ["derive"], version = "1.0.228" }
walkdir       = "2"
