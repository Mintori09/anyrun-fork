name: "Build with Cargo"
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Format check
        run: nix develop -c cargo fmt --all --check

      - name: Clippy check
        run: nix develop -c cargo clippy --workspace -- -D warnings

      - name: Build
        run: nix develop -c cargo build --verbose

      - name: Run unit tests
        run: nix develop -c cargo test --workspace --bins --lib --verbose

      - name: Run non-GUI integration tests
        run: nix develop -c cargo test -p anyrun-provider --test ipc_e2e --verbose
