name: "Check flake & Build packages"

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: ["master"]
    paths-ignore:
      - .gitignore
      - README.md

jobs:
  check-flake:
    name: "Check flake validity"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check Flake
        run: nix flake check --accept-flake-config

  build:
    name: "Build Exposed Packages"
    runs-on: ubuntu-latest
    needs: check-flake
    strategy:
      matrix:
        package:
          - anyrun
          - anyrun-applications
          - anyrun-bluetooth
          - anyrun-browser
          - anyrun-calc
          - anyrun-findfiles
          - anyrun-git-projects
          - anyrun-kde-setting
          - anyrun-shell-wrapper
          - anyrun-shell-wrapper-once
          - anyrun-sync-manager
          - anyrun-universal-action
          - anyrun-websearch
          - anyrun-zoxide
          - dictionary
          - kde-clipboard
          - kidex
          - kill-port
          - nix-run
          - randr
          - stdin
          - symbols
          - translate
          - window-switcher
    steps:
      - uses: easimon/maximize-build-space@v10
        with:
          overprovision-lvm: true
          remove-android: true
          remove-dotnet: true
          remove-haskell: true
          remove-docker-images: true
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build anyrun from the defined matrix
        run: nix build .#${{ matrix.package }} --print-build-logs --extra-substituters "https://anyrun.cachix.org"
