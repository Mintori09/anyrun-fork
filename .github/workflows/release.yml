name: "Build Release"
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src, clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config curl \
            libgtk-4-dev libadwaita-1-dev \
            libdbus-1-dev \
            libnotify-dev \
            meson ninja-build valac

      - name: Install gtk4-layer-shell
        run: |
          git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build
          ninja -C build
          sudo ninja -C build install

      - name: Build anyrun
        run: cargo build --release -p anyrun --verbose

      - name: Build anyrun-provider
        run: cargo build --release -p anyrun-provider --verbose

      - uses: actions/upload-artifact@v4
        name: Upload binaries
        with:
          name: anyrun-release
          path: |
            target/release/anyrun
            target/release/anyrun-provider
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: anyrun-release
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: true