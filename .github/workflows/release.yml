name: "Build Release"
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build binaries
        run: nix develop -c cargo build --release -p anyrun -p anyrun-provider --verbose

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp target/release/anyrun target/release/anyrun-provider dist/

      - uses: actions/upload-artifact@v4
        name: Upload binaries
        with:
          name: anyrun-release
          path: dist/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: anyrun-release
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: true